name: Ingest Markdown Files

on:
  push:
    branches:
      - main
      - feat/ai-assistant
    paths:
      - 'ai-knowledge-base/**.md'
  workflow_dispatch:

jobs:
  ingest:
    name: Run Ingest Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @portfolio/database run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify required secrets are set
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$GEMINI_API_KEY" ] && missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All required secrets are set ✓"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Markdown Ingestion
        run: pnpm --filter @portfolio/assistant run ingest --source=md
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
